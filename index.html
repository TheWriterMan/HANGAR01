<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <!-- Pre-paint theme. External (not inline) because the CSP blocks inline scripts. -->
    <script src="/theme-init.js"></script>
    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="HANGAR01 News &amp; Tutorials"
      href="/news/rss.xml"
    />

    <!-- Self-hosted (see src/index.css). Inter sets almost all text, so fetch it early. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
