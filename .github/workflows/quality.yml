name: Quality Gate

# Runs on every pull request and on pushes to feature branches.
# Pushes to main/dev run this same workflow via ci.yml, so the deploy
# only happens after the gate passes.
on:
  pull_request:
  push:
    branches-ignore: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the aircraft index and sitemap date pages by their last commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # pretypecheck regenerates content/aircraft-index.json
      - name: Typecheck
        run: npm run typecheck

      - name: Validate checklists
        run: node scripts/validate-checklists.mjs

      - name: Unit tests
        run: npm test

      # Builds the client, the SSR bundle and the prerendered pages in dist/.
      - name: Build
        run: npm run build

      - name: SEO check
        run: npm run seo:check

      # Runtime dependencies only: @vercel/node is a types-only dev dependency
      # that bundles an old undici and would fail this step for no user impact.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
