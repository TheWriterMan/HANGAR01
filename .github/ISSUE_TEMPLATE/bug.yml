name: Site bug
description: Something on the site doesn't work or looks broken
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://www.hangar01.space/aircraft/a320
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone 15
